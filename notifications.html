<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | WAYNE LOGS</title><link rel="icon" type="image/png" href="/assets/wayne-bat-logo.jpg"><link rel="apple-touch-icon" href="/assets/wayne-bat-logo.jpg"><meta name="theme-color" content="#0f2d53"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium-pages.css?v=20260825-optimized2"><link rel="stylesheet" href="wayne-rebuild.css?v=20260826-rebuild6"></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><div class="nav-actions"><a class="ghost-btn" href="index.html">Shop</a><a class="ghost-btn" href="profile.html">Profile</a><button class="ghost-btn" id="logout">Logout</button></div></div></nav><main class="section"><div class="container"><div class="section-head"><div><span class="profile-kicker">ACCOUNT UPDATES</span><h2>Notifications</h2><p>Purchases, wallet activity, support replies and announcements.</p></div><button class="ghost-btn" id="readAll">Mark all as read</button></div><div id="message" class="message"></div><div id="notificationList" class="notification-list"><div class="empty">Loading notifications…</div></div></div></main><script src="config.js?v=20260827-feedback3"></script><script src="feedback.js?v=20260827-feedback3"></script><script>
const API_URL=window.WAYNE_API_URL||localStorage.getItem("wayneApiUrl")||"http://localhost:5000",token=localStorage.getItem("wayneToken");if(!token)location.replace("login.html");const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:"Bearer "+token};const r=await fetch(API_URL+path,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||"Request failed");return d}async function load(){try{const d=await api("/api/notifications/my");$("notificationList").innerHTML=d.notifications.length?d.notifications.map(n=>`<a class="notification-card ${n.readAt?"":"unread"}" href="${esc(n.link||"notifications.html")}" data-notification="${esc(n._id)}"><span class="notification-icon">${n.type==="purchase"?"🛒":n.type==="wallet"?"💳":n.type==="support"?"💬":"📣"}</span><span><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><small>${new Date(n.createdAt).toLocaleString()}</small></span>${n.readAt?"":"<i>New</i>"}</a>`).join(""):'<div class="empty">No notifications yet.</div>'}catch(e){$("message").textContent=e.message;$("message").className="message error";$("message").style.display="block"}}$("notificationList").onclick=async e=>{const a=e.target.closest("[data-notification]");if(!a)return;e.preventDefault();try{await api(`/api/notifications/${encodeURIComponent(a.dataset.notification)}/read`,{method:"PATCH"})}finally{location.href=a.href}};$("readAll").onclick=async()=>{await api("/api/notifications/read-all",{method:"PATCH"});await load()};$("logout").onclick=()=>{localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");location.href="login.html"};load();
</script></body></html>
