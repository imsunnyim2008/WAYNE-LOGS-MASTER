/h1><p style="color:var(--muted)">Create an account to buy and track your orders.</p><div id="message" class="message"></div><form id="form"><div class="admin-grid"><div class="field"><label>First name</label><input name="firstName" required></div><div class="field"><label>Last name</label><input name="lastName" required></div></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"><small style="color:var(--muted)">Use uppercase, lowercase and at least one number.</small></div><div class="field"><label>Referral code <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input name="referralCode" id="referralCode" maxlength="20" autocomplete="off" placeholder="Enter a friend's code"><small style="color:var(--muted)">Your friend earns ₦1,000 after your first qualifying purchase.</small></div><button class="primary-btn" style="width:100%">Create Account</button></form><p style="color:var(--muted);text-align:center">Already registered? <a href="login.html" style="color:var(--blue)">Login</a></p></section></main><script src="config.js?v=20260827-loader1"></script><script>
const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"http://localhost:5000",form=document.getElementById("form"),msg=document.getElementById("message");document.getElementById("referralCode").value=(new URLSearchParams(location.search).get("ref")||"").toUpperCase();
function show(t){msg.textContent=t;msg.className="message error";msg.style.display="block"}
form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form);try{const body={firstName:fd.get("firstName"),lastName:fd.get("lastName"),email:fd.get("email"),phone:fd.get("phone"),password:fd.get("password"),referralCode:fd.get("referralCode")};const r=await fetch(API_URL+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.message||"Registration failed");localStorage.setItem("wayneToken",d.token);localStorage.setItem("wayneUser",JSON.stringify(d.user));const buy=localStorage.getItem("wayneBuyAfterLogin");location.href=buy?`index.html?buy=${encodeURIComponent(buy)}`:(d.user.role==="admin"?"admin.html":"index.html")}catch(err){show(err.message)}};
</script></body></html>
