<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Private Password | WAYNE LOGS</title><link rel="icon" type="image/png" href="/assets/wayne-bat-logo.png"><link rel="apple-touch-icon" href="/assets/wayne-bat-logo.png"><meta name="theme-color" content="#0f2d53"><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><span class="profile-kicker">PASSWORD CHANGE REQUIRED</span><h1>Create your private password</h1><p style="color:var(--muted)">Your temporary password has been used and cannot be used again. Create a password known only to you before continuing.</p><div id="message" class="message"></div><form id="form"><div class="field"><label>New private password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm private password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><p class="notice">Use at least 8 characters with uppercase, lowercase and a number.</p><button class="primary-btn" id="button" style="width:100%">Create My Private Password</button></form><button class="ghost-btn" id="leave" style="width:100%;margin-top:10px">Cancel and Logout</button></section></main><script src="config.js?v=20260825-desktopnav1"></script><script>
const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"http://localhost:5000",token=localStorage.getItem("wayneToken"),form=document.getElementById("form"),message=document.getElementById("message"),button=document.getElementById("button");if(!token)location.replace("login.html");function show(text,type){message.textContent=text;message.className="message "+type;message.style.display="block"}form.onsubmit=async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirmPassword").value;if(password!==confirm)return show("The two passwords do not match.","error");button.disabled=true;button.textContent="Saving securely…";try{const r=await fetch(API_URL+"/api/auth/change-password",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({password})}),d=await r.json();if(!r.ok)throw new Error(d.message||"Could not change password.");localStorage.setItem("wayneToken",d.token);localStorage.setItem("wayneUser",JSON.stringify(d.user));show("Your private password was created successfully. Opening your account…","success");form.hidden=true;document.getElementById("leave").hidden=true;setTimeout(()=>location.replace("index.html"),1800)}catch(error){show(error.message,"error");button.disabled=false;button.textContent="Create My Private Password"}};document.getElementById("leave").onclick=()=>{localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");location.replace("login.html")};
</script></body></html>
