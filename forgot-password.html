<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0f2d53"><title>Forgot Password | WAYNE LOGS</title><link rel="icon" href="assets/wayne-bat-logo.jpg" type="image/jpeg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium-pages.css?v=20260825-optimized2"><link rel="stylesheet" href="wayne-rebuild.css?v=20260826-rebuild6"></head><body class="login-page"><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a>
<h1>Recover your account</h1><p style="color:var(--muted)">Enter the email address used for WAYNE LOGS. If it matches an account, we will send a secure recovery link.</p>
<div id="message" class="message" role="status" aria-live="polite" style="display:none"></div>
<form id="recoveryForm"><div class="field"><label for="email">Account email</label><input id="email" type="email" name="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"></div>
<button type="submit" id="recoveryButton" class="primary-btn" style="width:100%">Send recovery link</button></form>
<p style="color:var(--muted);font-size:13px;margin-top:16px">Recovery links expire after 15 minutes. Check your spam folder if you do not see the message.</p>
<p style="text-align:center"><a href="login.html" style="color:var(--blue)">← Back to sign in</a></p>
</section></main><script src="config.js?v=20261113-no-auto-modal"></script><script src="feedback.js?v=20261113-no-auto-modal"></script>
<script>
(()=>{
  const form=document.getElementById("recoveryForm"),button=document.getElementById("recoveryButton"),message=document.getElementById("message");
  function show(text,kind){message.textContent=text;message.className="message "+kind;message.style.display="block";}
  form.addEventListener("submit",async e=>{
    e.preventDefault();button.disabled=true;button.textContent="Sending securely…";message.style.display="none";
    try{
      const r=await fetch(window.WAYNE_API_URL+"/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim()})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.message||"Could not request recovery. Try again.");
      form.reset();show(data.message||"If an account exists for that email, a reset link will be sent.","success");
    }catch(error){show(error.message,"error");}
    finally{button.disabled=false;button.textContent="Send recovery link";}
  });
})();
</script></body></html>
