<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | WAYNE LOGS</title><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><div class="nav-actions"><a class="ghost-btn" href="index.html">Store</a><button class="ghost-btn" id="logout">Logout</button></div></div></nav><main class="section"><div class="container"><div class="section-head"><div><h2>My Orders</h2><p>Track payment, order status and completed fulfillment.</p></div></div><div id="message" class="message"></div><div id="ordersList" class="order-list"><div class="empty">Loading orders...</div></div></div></main><script src="config.js"></script><script>
const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"http://localhost:5000",token=localStorage.getItem("wayneToken"),params=new URLSearchParams(location.search),logout=document.getElementById("logout"),message=document.getElementById("message"),ordersList=document.getElementById("ordersList");if(!token)location.replace("login.html");logout.onclick=()=>{localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");location.href="login.html"};function money(n){return"₦"+Number(n||0).toLocaleString("en-NG")}function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}async function verify(){if(params.get("payment")!=="callback"||!params.get("order")||!params.get("reference"))return;try{const r=await fetch(API_URL+`/api/orders/${params.get("order")}/paystack/verify`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({reference:params.get("reference")})});const d=await r.json();if(!r.ok)throw new Error(d.message||"Verification failed");message.textContent="Payment verified successfully.";message.className="message success";message.style.display="block";history.replaceState({},"","orders.html?order="+params.get("order"))}catch(e){message.textContent=e.message;message.className="message error";message.style.display="block"}}async function load(){try{const r=await fetch(API_URL+"/api/orders/my",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.message||"Could not load orders");ordersList.innerHTML=d.orders.length?d.orders.map(o=>`<div class="order-card"><div class="order-top"><div><div class="order-name">${esc(o.productName)}</div><div class="order-meta">${esc(o._id)}<br>${new Date(o.createdAt).toLocaleString()}</div></div><div class="order-price">${money(o.totalAmount)}</div></div><div class="badges"><span class="badge ${o.paymentStatus}">Payment: ${esc(o.paymentStatus)}</span><span class="badge ${o.status}">Order: ${esc(o.status)}</span></div>${o.deliveryContent?`<div class="delivery"><h3>🔓 Your Delivery</h3><div class="delivery-content">${esc(o.deliveryContent)}</div></div>`:`<div class="locked">🔒 Fulfillment unlocks after verified payment and completion.</div>`}</div>`).join(""):`<div class="empty">No orders yet.</div>`}catch(e){message.textContent=e.message;message.className="message error";message.style.display="block"}}(async()=>{await verify();await load()})();
</script></body></html>
