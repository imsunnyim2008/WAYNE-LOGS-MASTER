<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders | WAYNE LOGS</title><link rel="icon" type="image/png" href="/assets/wayne-bat-logo.png"><link rel="apple-touch-icon" href="/assets/wayne-bat-logo.png"><meta name="theme-color" content="#0f2d53">
<link rel="stylesheet" href="styles.css?v=20260823-delivery1">
<style>
.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.order-actions button,.order-actions a{display:inline-flex;text-decoration:none}
.order-help{padding:14px;border-radius:14px;background:rgba(124,92,255,.08);border:1px solid rgba(124,92,255,.18);color:var(--muted);margin-bottom:18px}
.order-card{position:relative}.order-product-line{display:flex;gap:11px;align-items:center}.order-icon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#f4f8fb;border:1px solid #dce7ef;box-shadow:0 7px 16px rgba(24,69,110,.08);font-size:21px;flex:0 0 auto}.order-icon img{width:31px;height:31px;object-fit:contain}.order-icon-fallback{font-weight:950;color:var(--brand,#1265c4);font-family:Arial,sans-serif}
</style>
</head><body>
<nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><div class="nav-actions"><a class="ghost-btn" href="index.html">Shop</a><a class="ghost-btn" href="dashboard.html">Wallet</a><a class="ghost-btn" href="profile.html">Profile</a><button class="ghost-btn" id="logout">Logout</button></div></div></nav>
<main class="section"><div class="container">
<div class="section-head"><div><h2>My Orders</h2><p>Payment and delivery status for everything you buy.</p></div></div>
<div class="order-help">If a payment did not open or was interrupted, use <strong>Pay Now</strong> on the pending order. You do not need to create the order again.</div>
<div id="message" class="message"></div>
<div id="ordersList" class="order-list"><div class="empty">Loading orders...</div></div>
</div></main>
<script src="config.js?v=20260825-desktopnav1"></script>
<script>
const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"http://localhost:5000";
const token=localStorage.getItem("wayneToken"),params=new URLSearchParams(location.search);
const logout=document.getElementById("logout"),message=document.getElementById("message"),ordersList=document.getElementById("ordersList");
if(!token)location.replace("login.html");
logout.onclick=()=>{localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");location.href="login.html"};
function money(n){return"₦"+Number(n||0).toLocaleString("en-NG")}
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
const orderPlatformIcons={facebook:["facebook","1877F2","f"],instagram:["instagram","E4405F","◎"],tiktok:["tiktok","000000","♪"],"tiktok ads":["tiktok","000000","♪"],youtube:["youtube","FF0000","▶"],twitter:["x","000000","X"],x:["x","000000","X"],discord:["discord","5865F2","D"],telegram:["telegram","26A5E4","➤"],whatsapp:["whatsapp","25D366","W"],linkedin:["linkedin","0A66C2","in"],snapchat:["snapchat","FFFC00","S"],reddit:["reddit","FF4500","R"],pinterest:["pinterest","BD081C","P"],quora:["quora","B92B27","Q"],github:["github","181717","G"],spotify:["spotify","1ED760","S"],grindr:["grindr","FEC016","G"],bumble:["bumble","FFC629","B"],badoo:["badoo","783BF9","B"],threads:["threads","000000","@"],twitch:["twitch","9146FF","T"],"private internet access":["privateinternetaccess","1E811F","PIA"],pia:["privateinternetaccess","1E811F","PIA"],expressvpn:["expressvpn","DA3940","E"],"express vpn":["expressvpn","DA3940","E"],"proton vpn":["protonvpn","6D4AFF","P"],protonvpn:["protonvpn","6D4AFF","P"],vpn:["protonvpn","6D4AFF","V"]};
function orderPlatformKey(value){const key=String(value||"").trim().toLowerCase();if(["twitter / x","x.com"].includes(key))return"x";return key}
function orderPlatformIcon(platform,fallback="★"){const entry=orderPlatformIcons[orderPlatformKey(platform)];if(!entry)return`<span class="order-icon-fallback">${esc(fallback)}</span>`;return`<img src="https://cdn.simpleicons.org/${entry[0]}/${entry[1]}" alt="${esc(platform)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="order-icon-fallback" style="--brand:#${entry[1]}" hidden>${esc(entry[2])}</span>`}
function show(t,type="error"){message.textContent=t;message.className="message "+type;message.style.display="block"}
if(params.get("walletPurchase")==="success"){show("Wallet payment completed successfully.","success");window.waynePopup?.("Your wallet payment completed successfully and your order is ready.","success","Purchase successful");history.replaceState({},"","orders.html")}
async function retryPayment(orderId,button){
 button.disabled=true;button.textContent="Paying from wallet...";
 try{
  const r=await fetch(API_URL+`/api/orders/${encodeURIComponent(orderId)}/wallet/pay`,{method:"POST",headers:{Authorization:"Bearer "+token}});
  const d=await r.json();if(!r.ok)throw new Error(d.message||"Wallet payment could not be completed");
  show("Wallet payment completed successfully.","success");await load();
 }catch(e){show(e.message);button.disabled=false;button.textContent="Pay from Wallet"}
}
async function load(){
 try{
  const r=await fetch(API_URL+"/api/orders/my",{headers:{Authorization:"Bearer "+token}});
  const d=await r.json();if(!r.ok)throw new Error(d.message||"Could not load orders");
  ordersList.innerHTML=d.orders.length?d.orders.map(o=>`
   <div class="order-card">
    <div class="order-top">
     <div class="order-product-line">
      <div class="order-icon">${orderPlatformIcon(o.platform,o.productIcon||"★")}</div>
      <div><div class="order-name">${esc(o.productName)}</div><div class="order-meta">${esc(o.platform||"Digital")}<br>${new Date(o.createdAt).toLocaleString()}</div></div>
     </div>
     <div class="order-price">${money(o.totalAmount)}</div>
    </div>
    <div class="badges"><span class="badge ${esc(o.paymentStatus)}">Payment: ${o.paymentStatus==="paid"?"Successful":esc(o.paymentStatus)}</span><span class="badge ${esc(o.status)}">Order: ${o.status==="completed"?"Successful":esc(o.status)}</span></div>
    ${o.deliveryContent?`<div class="delivery"><h3>🔓 Your Purchased Login Details</h3><div class="delivery-content">${esc(o.deliveryContent)}</div><button class="ghost-btn copy-delivery" type="button">Copy Login Details</button><small>Keep these details private. They were assigned only to your order.</small></div>`:`<div class="locked">🔒 Your login details will appear here immediately after a successful wallet purchase.</div>`}
    <div class="order-actions">
      ${o.paymentStatus==="pending"?`<button class="primary-btn" type="button" data-pay="${esc(o._id)}">Pay from Wallet</button>`:""}
      <a class="ghost-btn" href="support.html?order=${esc(o._id)}">Get Support</a>
      <a class="ghost-btn" href="index.html#shop">Back to Shop</a>
    </div>
   </div>`).join(""):`<div class="empty">No orders yet. <a href="index.html#shop" style="color:var(--blue)">Go to the shop</a>.</div>`;
  ordersList.querySelectorAll("[data-pay]").forEach(btn=>btn.addEventListener("click",()=>retryPayment(btn.dataset.pay,btn)));
  ordersList.querySelectorAll(".copy-delivery").forEach(btn=>btn.addEventListener("click",async()=>{const text=btn.parentElement.querySelector(".delivery-content")?.textContent||"";try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement("textarea");area.value=text;document.body.appendChild(area);area.select();document.execCommand("copy");area.remove()}window.waynePopup?.("Login details copied successfully.","success");btn.textContent="Copied!";setTimeout(()=>btn.textContent="Copy Login Details",1800)}));
 }catch(e){show(e.message)}
}
load();
</script>
</body></html>
