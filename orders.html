<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Orders | WAYNE LOGS</title>
  <link rel="icon" type="image/png" href="/assets/wayne-bat-logo.jpg">
  <link rel="apple-touch-icon" href="/assets/wayne-bat-logo.jpg">
  <meta name="theme-color" content="#0f2d53">
  <link rel="stylesheet" href="styles.css?v=20260823-delivery1">
  <link rel="stylesheet" href="premium-pages.css?v=20260825-optimized2">
  <link rel="stylesheet" href="wayne-rebuild.css?v=20260826-rebuild6">
  <link rel="stylesheet" href="marketplace-pages.css?v=20260827-orders1">
  <link rel="stylesheet" href="marketplace-compact.css?v=20260827-compact2">
</head>
<body class="market-orders">
  <header class="market-page-header">
    <div class="market-page-header-inner">
      <button class="market-menu-btn" id="marketMenuBtn" type="button" aria-label="Open menu">
        <svg class="market-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="market-brand" href="index.html">
        <span class="market-logo-frame"><img src="assets/wayne-bat-logo.png" alt="WAYNE LOGS logo"></span>
        <span>WAYNE LOGS</span>
      </a>
      <div class="market-header-actions">
        <button class="market-icon-btn" type="button" aria-label="Appearance" title="Appearance">
          <svg class="market-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.3A9 9 0 0 1 8.7 3.7a9 9 0 1 0 11.6 11.6Z"/></svg>
        </button>
        <a class="market-icon-btn" href="notifications.html" aria-label="Notifications" title="Notifications">
          <svg class="market-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span class="market-notification-dot" aria-hidden="true"></span>
        </a>
        <a class="market-icon-btn" href="index.html#categories" aria-label="Categories" title="Categories">
          <svg class="market-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div class="market-side-overlay" id="marketSideOverlay"></div>
  <aside class="market-side-panel" id="marketSidePanel" aria-label="Customer menu">
    <div class="market-side-head">
      <span class="market-logo-frame"><img src="assets/wayne-bat-logo.png" alt="WAYNE LOGS logo"></span>
      <strong>WAYNE LOGS</strong>
      <button class="market-side-close" id="marketSideClose" type="button" aria-label="Close menu">×</button>
    </div>

    <div class="market-side-label">MAIN</div>
    <nav class="market-side-links">
      <a href="index.html">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg></span> Home
      </a>
      <a href="profile.html">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span> Profile
      </a>
    </nav>

    <div class="market-side-label">SHOP</div>
    <nav class="market-side-links">
      <a href="index.html#shop">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><path d="M4 10h16l-1-5H5l-1 5Z"/><path d="M5 10v9h14v-9M9 14h6"/></svg></span> All Products
      </a>
      <a class="active" href="orders.html">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span> My Orders
      </a>
      <a href="dashboard.html">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 11h5M12 9v7M8.5 12.5h7"/></svg></span> Add Funds
      </a>
      <a href="dashboard.html#transactions">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span> Transactions
      </a>
      <a href="index.html#categories">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span> Categories
      </a>
      <a href="support.html">
        <span class="market-side-icon"><svg class="market-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.5 2.5 0 1 1 4.6 1.3c-.8 1.1-2.3 1.3-2.3 3M12 17h.01"/></svg></span> Support
      </a>
    </nav>

    <div class="market-side-account">
      <strong id="menuUser">Customer Account</strong>
      <a href="dashboard.html">Wallet / Top Up →</a>
      <a href="#" id="logout">Logout</a>
    </div>
  </aside>

  <main class="market-orders-main">
    <div id="message" class="message"></div>
    <div id="ordersView"><div class="market-orders-empty">Loading orders...</div></div>
  </main>

  <script src="config.js?v=20260827-feedback3"></script><script src="feedback.js?v=20260827-reviewui1"></script>
  <script>
  const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"https://wayne-logs-master-api.onrender.com";
  const token=localStorage.getItem("wayneToken"),params=new URLSearchParams(location.search),view=document.getElementById("ordersView"),message=document.getElementById("message");
  if(!token)location.replace("login.html");
  const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};
  const money=n=>"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
  const platformIcons={facebook:["facebook","1877F2","f"],instagram:["instagram","E4405F","◎"],tiktok:["tiktok","000000","♪"],"tiktok ads":["tiktok","000000","♪"],youtube:["youtube","FF0000","▶"],twitter:["x","000000","X"],x:["x","000000","X"],discord:["discord","5865F2","D"],telegram:["telegram","26A5E4","➤"],whatsapp:["whatsapp","25D366","W"],linkedin:["linkedin","0A66C2","in"],snapchat:["snapchat","FFFC00","S"],reddit:["reddit","FF4500","R"],pinterest:["pinterest","BD081C","P"],quora:["quora","B92B27","Q"],github:["github","181717","G"],spotify:["spotify","1ED760","S"],"private internet access":["privateinternetaccess","1E811F","PIA"],pia:["privateinternetaccess","1E811F","PIA"],expressvpn:["expressvpn","DA3940","E"],"express vpn":["expressvpn","DA3940","E"],"proton vpn":["protonvpn","6D4AFF","P"],protonvpn:["protonvpn","6D4AFF","P"],vpn:["protonvpn","6D4AFF","VPN"]};
  function pkey(v){const k=String(v||"").trim().toLowerCase();return["twitter / x","x.com","twitter"].includes(k)?"x":k}
  function icon(platform,fallback="★"){const e=platformIcons[pkey(platform)];if(!e)return`<span>${esc(fallback)}</span>`;return`<img src="https://cdn.simpleicons.org/${e[0]}/${e[1]}" alt="${esc(platform)}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>${esc(e[2])}</span>`}
  function show(text,type="error"){message.textContent=text;message.className="message "+type;message.style.display="block"}
  function shortId(o){return"#WL-"+String(o?._id||"").slice(-6).toUpperCase()}
  function relative(date){const seconds=Math.max(1,Math.floor((Date.now()-new Date(date).getTime())/1000));if(seconds<60)return seconds+" sec ago";const m=Math.floor(seconds/60);if(m<60)return m+" min ago";const h=Math.floor(m/60);if(h<24)return h+" hr"+(h===1?"":"s")+" ago";const d=Math.floor(h/24);if(d<30)return d+" day"+(d===1?"":"s")+" ago";return new Date(date).toLocaleDateString()}
  function statusText(o){if(o.paymentStatus==="paid"&&o.status==="completed")return"Completed";if(o.status==="processing")return"Processing";if(o.status==="cancelled")return"Cancelled";if(o.paymentStatus==="failed")return"Failed";if(o.paymentStatus==="refunded"||o.status==="refunded")return"Refunded";return"Pending"}
  function statusClass(o){return statusText(o).toLowerCase()}
  let orders=[];

  function openMenu(){document.getElementById("marketSidePanel").classList.add("open");document.getElementById("marketSideOverlay").classList.add("show");document.body.style.overflow="hidden"}
  function closeMenu(){document.getElementById("marketSidePanel").classList.remove("open");document.getElementById("marketSideOverlay").classList.remove("show");document.body.style.overflow=""}
  document.getElementById("marketMenuBtn").onclick=openMenu;document.getElementById("marketSideClose").onclick=closeMenu;document.getElementById("marketSideOverlay").onclick=closeMenu;
  document.getElementById("logout").onclick=e=>{e.preventDefault();localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");location.href="login.html"};
  try{const u=JSON.parse(localStorage.getItem("wayneUser")||"null");if(u?.firstName)document.getElementById("menuUser").textContent=u.firstName+(u.lastName?" "+u.lastName:"")}catch{}

  function renderList(){
    history.replaceState({},"","orders.html");
    view.innerHTML=`<div class="market-orders-title"><h1>My Orders</h1><p>${orders.length} order${orders.length===1?"":"s"} total</p></div>`+(orders.length?`<div class="market-orders-card">${orders.map(o=>`<div class="market-order-row" data-order="${esc(o._id)}" role="button" tabindex="0"><div class="market-order-icon">${icon(o.platform,o.productIcon||"★")}</div><div class="market-order-copy"><strong>${esc(o.productName)}</strong><small>${shortId(o)} · ${relative(o.createdAt)}${Number(o.quantity)>1?` · Qty: ${Number(o.quantity)}`:""}</small></div><div class="market-order-right"><b>${money(o.totalAmount)}</b><span class="market-status ${statusClass(o)}">${esc(statusText(o))}</span></div><span class="market-order-arrow">›</span></div>`).join("")}</div>`:'<div class="market-orders-card"><div class="market-orders-empty">No orders yet.<br><a href="index.html#shop" style="color:#0893d0;font-weight:900">Go to the shop →</a></div></div>');
  }
  function renderDetail(o){
    if(!o){renderList();return}
    history.pushState({order:o._id},"",`orders.html?order=${encodeURIComponent(o._id)}`);
    const ref=o.paymentReference||("ORD_"+String(o._id).slice(-10).toUpperCase());
    view.innerHTML=`<a class="market-back-link" href="orders.html" id="backOrders">← Back to Orders</a><div class="market-order-detail"><div class="market-order-detail-head"><div class="market-receipt-icon"><svg class="market-svg" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg></div><div><h2>Order ${shortId(o)}</h2><small>${new Date(o.createdAt).toLocaleString()}</small></div><span class="market-status ${statusClass(o)}">${esc(statusText(o))}</span></div><div class="market-order-detail-body"><div class="market-detail-product"><div class="market-order-icon">${icon(o.platform,o.productIcon||"★")}</div><div><strong>${esc(o.productName)}</strong><small>Qty: ${Number(o.quantity||1)} · Ref: ${esc(ref)}</small></div></div><div class="market-price-box"><div class="market-price-line"><span>Subtotal</span><span>${money(o.totalAmount)}</span></div><div class="market-price-line total"><span>Total Paid</span><strong>${o.paymentStatus==="paid"?money(o.totalAmount):"—"}</strong></div></div>${o.deliveryContent?`<div class="market-delivery-title">DELIVERY DETAILS</div><div class="market-delivery-box"><button class="market-copy-btn" id="copyDelivery" type="button">Copy</button>${esc(o.deliveryContent)}</div>`:`<div class="market-delivery-title">DELIVERY DETAILS</div><div class="market-locked">${o.paymentStatus==="paid"?"Your order is being processed. Delivery details will appear here when ready.":"Delivery details appear here after successful payment and completion."}</div>`}<div class="market-detail-actions">${o.paymentStatus==="pending"?`<button class="market-pay-btn" id="retryWallet" type="button">Pay from Wallet</button>`:""}<a class="market-all-orders-btn" href="orders.html" id="allOrders">All Orders</a><a class="market-all-orders-btn" href="support.html?order=${esc(o._id)}">Get Support</a></div></div></div>`;
    document.getElementById("backOrders").onclick=e=>{e.preventDefault();renderList()};document.getElementById("allOrders").onclick=e=>{e.preventDefault();renderList()};
    document.getElementById("copyDelivery")?.addEventListener("click",async e=>{const text=o.deliveryContent||"";try{await navigator.clipboard.writeText(text)}catch{const area=document.createElement("textarea");area.value=text;document.body.appendChild(area);area.select();document.execCommand("copy");area.remove()}e.currentTarget.textContent="Copied!";setTimeout(()=>e.currentTarget.textContent="Copy",1600)});
    document.getElementById("retryWallet")?.addEventListener("click",e=>retryPayment(o._id,e.currentTarget));
  }
  async function retryPayment(id,button){button.disabled=true;button.textContent="Paying...";try{const r=await fetch(API_URL+`/api/orders/${encodeURIComponent(id)}/wallet/pay`,{method:"POST",headers:{Authorization:"Bearer "+token}}),d=await r.json();if(!r.ok)throw new Error(d.message||"Wallet payment could not be completed");show("Wallet payment completed successfully.","success");await load(id)}catch(err){show(err.message);button.disabled=false;button.textContent="Pay from Wallet"}}
  view.addEventListener("click",e=>{const row=e.target.closest("[data-order]");if(row){const o=orders.find(x=>String(x._id)===String(row.dataset.order));renderDetail(o)}});
  view.addEventListener("keydown",e=>{if(!["Enter"," "].includes(e.key))return;const row=e.target.closest("[data-order]");if(row){e.preventDefault();const o=orders.find(x=>String(x._id)===String(row.dataset.order));renderDetail(o)}});
  window.addEventListener("popstate",()=>{const id=new URLSearchParams(location.search).get("order");const o=orders.find(x=>String(x._id)===String(id));id&&o?renderDetail(o):renderList()});

  async function load(preferredId){
    try{const r=await fetch(API_URL+"/api/orders/my",{headers:{Authorization:"Bearer "+token}}),d=await r.json();if(!r.ok)throw new Error(d.message||"Could not load orders");orders=Array.isArray(d.orders)?d.orders:[];const requested=preferredId||params.get("order");const selected=orders.find(o=>String(o._id)===String(requested));selected?renderDetail(selected):renderList()}catch(err){show(err.message);view.innerHTML='<div class="market-orders-card"><div class="market-orders-empty">Could not load your orders.</div></div>'}
  }
  if(params.get("walletPurchase")==="success")show("Wallet payment completed successfully.","success");
  load();
  </script>
</body>
</html>
