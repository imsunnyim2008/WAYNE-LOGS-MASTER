<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | WAYNE LOGS</title><link rel="icon" type="image/png" href="/assets/wayne-bat-logo.png"><link rel="apple-touch-icon" href="/assets/wayne-bat-logo.png"><meta name="theme-color" content="#0f2d53"><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><h1>Welcome back</h1><p style="color:var(--muted)">Sign in to continue your purchase or view orders.</p><div id="message" class="message"></div><form id="form"><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required></div><button class="primary-btn" style="width:100%">Login</button></form><p style="color:var(--muted);text-align:center">No account? <a href="register.html" style="color:var(--blue)">Create one</a></p></section></main><script src="config.js?v=20260823-feedback1"></script><script>
const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"http://localhost:5000",form=document.getElementById("form"),msg=document.getElementById("message");
function show(t){msg.textContent=t;msg.className="message error";msg.style.display="block"}
form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form);try{const r=await fetch(API_URL+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:fd.get("email"),password:fd.get("password")})});const d=await r.json();if(!r.ok)throw new Error(d.message||"Login failed");localStorage.setItem("wayneToken",d.token);localStorage.setItem("wayneUser",JSON.stringify(d.user));const buy=localStorage.getItem("wayneBuyAfterLogin");location.href=d.user.mustChangePassword?"force-change-password.html":(buy?`index.html?buy=${encodeURIComponent(buy)}`:(d.user.role==="admin"?"admin.html":"index.html"))}catch(err){show(err.message)}};
</script></body></html>
