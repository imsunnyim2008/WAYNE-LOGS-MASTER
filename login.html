<style>
.login-page{--auth-bg:#eaf3f8;--auth-card:#fff;--auth-ink:#142a42;--auth-muted:#61748c;--auth-line:#d5dfeb;--auth-soft:#f5f8fb;--auth-blue:#0679af;--auth-cyan:#08a6df;min-height:100vh;margin:0;background:var(--auth-bg)!important;color:var(--auth-ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html.wayne-dark-mode .login-page{--auth-bg:#091725;--auth-card:#102337;--auth-ink:#eef7ff;--auth-muted:#a6b9cf;--auth-line:#36536e;--auth-soft:#142d42;--auth-blue:#76d4ff}

.wayne-auth-eye{position:absolute;right:5px;display:grid;place-items:center;min-width:42px;min-height:44px;padding:0;border:0;background:transparent;color:var(--auth-muted);cursor:pointer}

.wayne-auth-action:disabled .wayne-auth-spinner{display:block}

@keyframes wayne-auth-spin{to{transform:rotate(360deg)}}
.login-page .wayne-auth-content .message{margin:0 0 18px;font-size:14px;overflow-wrap:anywhere}
.login-page .wayne-auth-content .message.success{color:#087d59;background:#e8faf3;border:1px solid #b6e7d4}
.login-page .wayne-auth-content .message.error{color:#a52640;background:#fff0f3;border:1px solid #f5c5d0}
.wayne-auth-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin:23px 0 0;font-size:13px;text-align:center}
.wayne-auth-footer{color:var(--auth-muted);font-size:11px;text-align:center;margin:22px 0 0;letter-spacing:.035em}
.wayne-auth-restart{display:block;margin:15px auto 0;background:none;border:0;color:var(--auth-blue);font-size:14px;font-weight:700;cursor:pointer}
.wayne-auth-theme:focus-visible,.wayne-auth-eye:focus-visible,.wayne-auth-tabs a:focus-visible,.wayne-auth-action:focus-visible,.wayne-auth-restart:focus-visible{outline:2px solid var(--auth-cyan);outline-offset:3px}
@media(max-width:420px){.login-page .wayne-login-shell{padding:66px 15px 22px;justify-content:flex-start}.wayne-auth-content{padding:27px 23px 24px}.wayne-auth-brand{margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){.wayne-auth-spinner{animation:none}}
</style><style>#wayneGoogleAuth{margin-top:24px}.wayne-google-divider{display:flex;gap:12px;align-items:center;justify-content:center;color:var(--auth-muted);font-size:14px;margin:0 0 16px}.wayne-google-divider:before,.wayne-google-divider:after{content:"";height:1px;background:var(--auth-line);flex:1}#googleButton{width:100%;display:flex;justify-content:center;min-height:40px}#googleStatus{font-size:13px;color:var(--auth-muted);line-height:1.5;overflow-wrap:anywhere;margin:9px 0}#googleStatus:empty{display:none}#googleProfile{margin-top:16px}#googleProfile .wayne-auth-input input{padding-inline:14px}#wayneGoogleAuth [hidden]{display:none!important}</style></head><body class="login-page"><main class="wayne-login-shell">

</div></section><footer class="wayne-auth-footer">© 2026 WAYNE LOGS · Digital Marketplace</footer></main><script src="config.js?v=20261113-no-auto-modal"></script><script src="feedback.js?v=20261113-no-auto-modal"></script><script>
const API_URL=window.WAYNE_API_URL||"http://localhost:5000",form=document.getElementById("form"),msg=document.getElementById("message"),twoFactorForm=document.getElementById("twoFactorForm");
const adminMode=new URLSearchParams(location.search).get("admin")==="1";
if(adminMode){
 document.title="Administrator Sign In | WAYNE LOGS";
 document.getElementById("loginHeading").textContent="Administrator sign-in";
 document.getElementById("loginSubtitle").textContent="Use ADMIN_PASS or your registered admin email, plus your existing secure password. The Admin ID requires at least 12 characters.";
 document.getElementById("loginIdentifierLabel").textContent="Admin ID or email";
 const identifier=document.getElementById("loginIdentifier");
 identifier.type="text";identifier.inputMode="text";identifier.placeholder="ADMIN_PASS or your admin email";

}
const emailField=document.getElementById("loginIdentifier"),passwordField=document.getElementById("loginPassword"),remember=document.getElementById("rememberEmail"),eye=document.getElementById("togglePassword"),theme=document.getElementById("authTheme");
if(adminMode){document.getElementById("rememberLabel").hidden=true;document.getElementById("signinTab").href="login.html?admin=1"}else{try{const saved=localStorage.getItem("wayneRememberedEmail");if(saved){emailField.value=saved;remember.checked=true}}catch{}}
remember.addEventListener("change",()=>{if(!remember.checked){try{localStorage.removeItem("wayneRememberedEmail")}catch{}}});

syncTheme();theme.onclick=()=>{if(typeof window.wayneApplyAppearance==="function"){window.wayneApplyAppearance(document.documentElement.classList.contains("wayne-dark-mode")?"light":"dark");syncTheme()}};
let pendingChallenge="";
function show(t){msg.textContent=t;msg.className="message error";msg.style.display="block"}
function finishLogin(d){if(!d.token||!d.user)throw Error("Login could not be verified.");if(adminMode&&d.user.role!=="admin")throw Error("This sign-in is reserved for the owner administrator.");if(!adminMode){try{if(remember.checked)localStorage.setItem("wayneRememberedEmail",emailField.value.trim());else localStorage.removeItem("wayneRememberedEmail")}catch{}}localStorage.setItem("wayneToken",d.token);localStorage.setItem("wayneUser",JSON.stringify(d.user));const buy=localStorage.getItem("wayneBuyAfterLogin");const qs=new URLSearchParams(location.search);const paymentReturn=qs.get("pay")==="1"&&d.user.role==="user"&&!d.user.mustChangePassword;const amount=Number(qs.get("amount"));const payUrl="pay.html"+(Number.isFinite(amount)&&amount>=1&&amount<=5000000?"?amount="+encodeURIComponent(String(amount)):"");msg.textContent="✓ Authentication successful!";msg.className="message success";msg.style.display="block";location.href=d.user.mustChangePassword?"force-change-password.html":(paymentReturn?payUrl:(buy?`index.html?buy=${encodeURIComponent(buy)}`:(d.user.role==="admin"?"admin.html":"index.html")))}
form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector("button[type=submit],button.primary-btn");submit.disabled=true;msg.style.display="none";try{const fd=new FormData(form);const r=await fetch(API_URL+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:fd.get("email"),password:fd.get("password")})}),d=await r.json();if(!r.ok){const error=Error(d.message||"Login failed");error.code=d.code;throw error}if(d.requiresTwoFactor){if(!d.challenge)throw Error("Verification challenge missing.");pendingChallenge=d.challenge;form.hidden=true;twoFactorForm.hidden=false;msg.style.display="none";document.getElementById("twoFactorCode").focus();return}finishLogin(d)}catch(err){show(err.message);if(err.code==="EMAIL_NOT_VERIFIED"){const a=document.createElement("a");a.href="verify-email.html";a.textContent="Resend verification email →";a.style.cssText="display:inline-block;margin-top:10px;color:var(--blue);font-weight:700";msg.appendChild(document.createElement("br"));msg.appendChild(a)}}finally{submit.disabled=false}};
