<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | WAYNE LOGS</title><link rel="icon" type="image/png" href="/assets/wayne-bat-logo.jpg"><link rel="apple-touch-icon" href="/assets/wayne-bat-logo.jpg"><meta name="theme-color" content="#0f2d53"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium-pages.css?v=20260825-optimized2"><link rel="stylesheet" href="wayne-rebuild.css?v=20260826-rebuild6"></head><body class="login-page"><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><h1>Welcome back</h1><p style="color:var(--muted)">Sign in to continue your purchase or view orders.</p><div id="message" class="message"></div><form id="form"><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required></div><button class="primary-btn" style="width:100%">Login</button></form><form id="twoFactorForm" hidden><div class="field"><label for="twoFactorCode">Authenticator or backup code</label><input id="twoFactorCode" type="text" inputmode="text" autocomplete="one-time-code" maxlength="64" placeholder="6-digit code" required></div><button id="verifyTwoFactorButton" class="primary-btn" style="width:100%">Verify and sign in</button><p style="text-align:center"><button id="restartLoginButton" type="button" class="ghost-btn" style="margin-top:12px">Use another account</button></p></form><p style="color:var(--muted);text-align:right;margin-top:10px"><a href="forgot-password.html" style="color:var(--blue);font-weight:700">Forgot password? Reset by email →</a></p><p style="color:var(--muted);text-align:center">No account? <a href="register.html" style="color:var(--blue)">Create one</a></p><a id="loginTelegramHelp" class="login-telegram-help" href="#" target="_blank" rel="noopener noreferrer" hidden><span class="login-telegram-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.1 10.6 20.2 3.8c.9-.4 1.8.4 1.6 1.4l-2.9 14c-.2 1-1.4 1.4-2.2.8l-4.5-3.4-2.3 2.2c-.5.5-1.3.1-1.3-.6l.2-4.1 8.7-7.4-10.4 6.2-3.9-1.1c-1-.3-1.1-1.7-.1-2.2Z"/></svg></span><span><strong>Need more help?</strong><small>Contact the WAYNE LOGS admin securely on Telegram.</small></span></a></section></main><script src="config.js?v=20261112-ultron-customer-help"></script><script src="feedback.js?v=20261112-ultron-customer-help"></script><script>
const API_URL=window.WAYNE_API_URL||"http://localhost:5000",form=document.getElementById("form"),msg=document.getElementById("message"),twoFactorForm=document.getElementById("twoFactorForm");
let pendingChallenge="";
function show(t){msg.textContent=t;msg.className="message error";msg.style.display="block"}
function finishLogin(d){if(!d.token||!d.user)throw Error("Login could not be verified.");localStorage.setItem("wayneToken",d.token);localStorage.setItem("wayneUser",JSON.stringify(d.user));const buy=localStorage.getItem("wayneBuyAfterLogin");const qs=new URLSearchParams(location.search);const paymentReturn=qs.get("pay")==="1"&&d.user.role==="user"&&!d.user.mustChangePassword;const amount=Number(qs.get("amount"));const payUrl="pay.html"+(Number.isFinite(amount)&&amount>=1&&amount<=5000000?"?amount="+encodeURIComponent(String(amount)):"");location.href=d.user.mustChangePassword?"force-change-password.html":(buy?`index.html?buy=${encodeURIComponent(buy)}`:(paymentReturn?payUrl:(d.user.role==="admin"?"admin.html":"index.html")))}
form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector("button[type=submit],button.primary-btn");submit.disabled=true;try{const fd=new FormData(form);const r=await fetch(API_URL+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:fd.get("email"),password:fd.get("password")})}),d=await r.json();if(!r.ok){const error=Error(d.message||"Login failed");error.code=d.code;throw error}if(d.requiresTwoFactor){if(!d.challenge)throw Error("Verification challenge missing.");pendingChallenge=d.challenge;form.hidden=true;twoFactorForm.hidden=false;msg.style.display="none";document.getElementById("twoFactorCode").focus();return}finishLogin(d)}catch(err){show(err.message);if(err.code==="EMAIL_NOT_VERIFIED"){const a=document.createElement("a");a.href="verify-email.html";a.textContent="Resend verification email →";a.style.cssText="display:inline-block;margin-top:10px;color:var(--blue);font-weight:700";msg.appendChild(document.createElement("br"));msg.appendChild(a)}}finally{submit.disabled=false}};
twoFactorForm.onsubmit=async e=>{e.preventDefault();const button=document.getElementById("verifyTwoFactorButton");button.disabled=true;try{const r=await fetch(API_URL+"/api/auth/2fa/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challenge:pendingChallenge,code:document.getElementById("twoFactorCode").value})}),d=await r.json();if(!r.ok)throw Error(d.message||"Incorrect code.");finishLogin(d)}catch(error){show(error.message);document.getElementById("twoFactorCode").value=""}finally{button.disabled=false}};
document.getElementById("restartLoginButton").onclick=()=>{pendingChallenge="";form.hidden=false;twoFactorForm.hidden=true;document.getElementById("twoFactorCode").value="";msg.style.display="none"};
</script><script>async function loadLoginTelegram(){try{const r=await fetch((window.WAYNE_API_URL||"http://localhost:5000")+"/api/settings/public"),d=await r.json(),a=document.getElementById("loginTelegramHelp"),url=d.settings?.telegramUrl;if(r.ok&&url){a.href=url;a.hidden=false}}catch{}}loadLoginTelegram();</script></body></html>
