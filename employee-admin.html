<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Employee reviews | WAYNE LOGS</title><style>
*{box-sizing:border-box}body{background:#0b182a;color:#e5f1ff;font:16px system-ui,sans-serif;margin:0}main{max-width:1000px;margin:auto;padding:24px}section{background:#14283e;border:1px solid #36516b;border-radius:16px;padding:20px;margin:20px 0}a{color:#9ddcff}article{padding:15px 0;border-bottom:1px solid #36516b;overflow-wrap:anywhere}button{background:#236ea6;color:#fff;padding:10px 16px;margin:8px 8px 0 0;border:0;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.danger{background:#813c49}p{white-space:pre-wrap}
</style></head><body><main><a href="admin.html">← Admin dashboard</a><h1>Employee management</h1><p>Approve only verified employees and authorized company-owned business assets. Never request Facebook passwords.</p><button id="refresh">Refresh reviews</button><p id="message" role="status"></p><section><h2>Employees</h2><div id="employees"></div></section><section><h2>Asset submissions</h2><div id="submissions"></div></section></main><script>
"use strict";
const base="https://wayne-logs-master-api.onrender.com/api/employees/admin",el=id=>document.getElementById(id),token=localStorage.getItem("wayneToken")||"";
function message(s){el("message").textContent=s}
async function api(path,method="GET",body){const response=await fetch(base+path,{method,headers:{Authorization:"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined,cache:"no-store"});const d=await response.json().catch(()=>({}));if(!response.ok)throw Error(d.message||"Request failed.");return d}
function row(text){const a=document.createElement("article"),p=document.createElement("p");p.textContent=text;a.append(p);return a}
function action(parent,label,path,status,danger){const b=document.createElement("button");b.textContent=label;if(danger)b.className="danger";b.onclick=async()=>{if(!confirm(label+"?"))return;b.disabled=true;try{await api(path,"PATCH",{status});await load();message("Review saved.")}catch(e){message(e.message)}finally{b.disabled=false}};parent.append(b)}
async function load(){const [e,s]=await Promise.all([api("/employees"),api("/submissions")]);const people=e.employees.map(x=>{const a=row(x.email+" · "+x.status+"\nRegistered: "+new Date(x.createdAt).toLocaleString());if(x.status!=="approved")action(a,"Approve employee","/employees/"+x._id,"approved");if(x.status!=="suspended")action(a,"Suspend employee","/employees/"+x._id,"suspended",true);return a});const assets=s.submissions.map(x=>{const a=row("Asset ID: "+x.assetId+"\nContact: "+x.contactEmail+"\nEmployee: "+(x.employee?.email||"Unavailable")+"\nStatus: "+x.status);if(x.status==="pending"){action(a,"Approve asset","/submissions/"+x._id,"approved");action(a,"Reject asset","/submissions/"+x._id,"rejected",true)}return a});el("employees").replaceChildren(...people);el("submissions").replaceChildren(...assets);if(!people.length)el("employees").textContent="No employees yet.";if(!assets.length)el("submissions").textContent="No submissions yet."}
el("refresh").onclick=()=>load().catch(e=>message(e.message));if(!token)message("Sign in to your existing admin account first.");else load().catch(e=>message(e.message));
</script></body></html>
