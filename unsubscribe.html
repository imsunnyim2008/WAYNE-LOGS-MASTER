<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe | WAYNE LOGS</title><link rel="stylesheet" href="growth.css"></head><body><main class="growth-main"><h1>Marketing email preferences</h1><section class="growth-card"><p>Stop receiving promotional emails. Transactional emails will continue.</p><button id="unsubscribe">Unsubscribe</button><p id="result" role="status"></p></section></main><script src="config.js"></script><script>const token=new URLSearchParams(location.hash.slice(1)).get("token");history.replaceState(null,"",location.pathname);document.getElementById("unsubscribe").onclick=async()=>{const button=document.getElementById("unsubscribe");button.disabled=true;try{const r=await fetch(window.WAYNE_API_URL+"/api/growth/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});const d=await r.json();document.getElementById("result").textContent=r.ok?"You have unsubscribed.":d.message;if(!r.ok)button.disabled=false}catch{button.disabled=false;document.getElementById("result").textContent="Could not unsubscribe. Please retry."}};</script></body></html>
