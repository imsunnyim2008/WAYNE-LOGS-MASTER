<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0f2d53"><title>Reset Password | WAYNE LOGS</title><link rel="icon" href="assets/wayne-bat-logo.jpg" type="image/jpeg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="premium-pages.css?v=20260825-optimized2"><link rel="stylesheet" href="wayne-rebuild.css?v=20260826-rebuild6"></head><body class="login-page"><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a>
<h1>Create a new password</h1><p style="color:var(--muted)">Your reset link works once and expires in 15 minutes. Choose a password only you know.</p>
<div id="message" class="message" role="status" aria-live="polite" style="display:none"></div>
<form id="resetForm"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
<div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
<p style="color:var(--muted);font-size:13px">Use 8–128 characters with uppercase, lowercase and a number.</p>
<button id="resetButton" class="primary-btn" style="width:100%">Save new password</button></form>
<p style="text-align:center;margin-top:18px"><a href="forgot-password.html" style="color:var(--blue)">Request another link</a> · <a href="login.html" style="color:var(--blue)">Sign in</a></p>
</section></main><script src="config.js?v=20261112-ultron-customer-help"></script><script src="feedback.js?v=20261112-ultron-customer-help"></script>
<script>
(()=>{
  const token=new URLSearchParams(location.hash.slice(1)).get("token")||"";
  history.replaceState(null,"",location.pathname);
  const form=document.getElementById("resetForm"),button=document.getElementById("resetButton"),message=document.getElementById("message");
  function show(text,kind){message.textContent=text;message.className="message "+kind;message.style.display="block";}
  if(!/^[a-f0-9]{64}$/i.test(token)){form.hidden=true;show("Your link is missing or invalid. Request a new reset email.","error");}
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const password=document.getElementById("password").value;
    if(password!==document.getElementById("confirm").value)return show("The two passwords do not match.","error");
    if(password.length<8||password.length>128||!/[a-z]/.test(password)||!/[A-Z]/.test(password)||!/[0-9]/.test(password))return show("Use 8–128 characters with uppercase, lowercase and a number.","error");
    button.disabled=true;button.textContent="Saving securely…";
    try{
      const r=await fetch(window.WAYNE_API_URL+"/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.message||"Could not reset the password.");
      localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");
      form.hidden=true;show("Password changed successfully. Use your new password to sign in.","success");
      const link=document.createElement("a");link.href="login.html";link.textContent="Go to login →";link.style.cssText="display:inline-block;margin-top:16px;color:var(--blue);font-weight:700";message.appendChild(document.createElement("br"));message.appendChild(link);
    }catch(error){show(error.message,"error");}
    finally{button.disabled=false;button.textContent="Save new password";}
  });
})();
</script></body></html>
