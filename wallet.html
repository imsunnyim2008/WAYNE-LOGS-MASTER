<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet | WAYNE LOGS</title><link rel="stylesheet" href="styles.css"><style>
.wallet-card{background:linear-gradient(135deg,#6045e8,#d33ca4);border-radius:24px;padding:26px;margin-bottom:20px}.wallet-balance{font-size:42px;font-weight:950;margin:8px 0}.wallet-grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.wallet-amount{font-size:20px}.tx{display:grid;grid-template-columns:1fr auto;gap:7px;padding:15px 0;border-bottom:1px solid var(--line)}.tx small{color:var(--muted)}.tx.deposit .tx-amount{color:var(--green)}.tx.purchase .tx-amount{color:#ff9aad}@media(max-width:800px){.wallet-grid{grid-template-columns:1fr}}
</style></head><body>
<nav class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WAYNE LOGS</span></a><div class="nav-actions"><a class="ghost-btn" href="index.html">Shop</a><a class="ghost-btn" href="orders.html">My Orders</a><button class="ghost-btn" id="logout">Logout</button></div></div></nav>
<main class="section"><div class="container"><div class="section-head"><div><h2>My Wallet</h2><p>Add store credit and use it for purchases. Withdrawals are not available.</p></div></div>
<div id="message" class="message"></div><section class="wallet-card"><small>WALLET BALANCE</small><div class="wallet-balance" id="balance">₦0.00</div><small>Credits appear only after the payment provider confirms payment to the server.</small></section>
<div class="wallet-grid"><section class="panel"><h3>Add Money</h3><form id="topupForm"><div class="field"><label>Amount (₦)</label><input class="wallet-amount" id="amount" type="number" min="100" step="1" required placeholder="5000"></div><button class="primary-btn" id="addMoney">Continue to secure payment</button></form><p class="notice">Minimum ₦100. No customer withdrawals.</p></section>
<section class="panel"><h3>Transaction History</h3><div id="transactions"><div class="empty">Loading...</div></div></section></div></div></main>
<script src="config.js"></script><script>
const API_URL=localStorage.getItem("wayneApiUrl")||window.WAYNE_API_URL||"http://localhost:5000",token=localStorage.getItem("wayneToken");if(!token)location.replace("login.html");
const balance=document.getElementById("balance"),transactions=document.getElementById("transactions"),message=document.getElementById("message"),form=document.getElementById("topupForm"),button=document.getElementById("addMoney");
const money=k=>"₦"+(Number(k||0)/100).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};
function show(t,type="error"){message.textContent=t;message.className="message "+type;message.style.display="block"}
async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:"Bearer "+token};const r=await fetch(API_URL+path,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||"Request failed");return d}
async function load(){const [w,h]=await Promise.all([api("/api/wallet"),api("/api/wallet/transactions")]);balance.textContent=money(w.wallet.balanceKobo);transactions.innerHTML=h.transactions.length?h.transactions.map(t=>`<div class="tx ${esc(t.type)}"><div><strong>${esc(t.description||t.type)}</strong><br><small>${new Date(t.createdAt).toLocaleString()} · ${esc(t.status)}</small></div><strong class="tx-amount">${t.type==="purchase"?"−":"+"}${money(t.amountKobo)}</strong></div>`).join(""):'<div class="empty">No wallet transactions yet.</div>'}
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;button.textContent="Starting...";try{const d=await api("/api/wallet/topups/initialize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:Number(document.getElementById("amount").value)})});location.href=d.authorizationUrl}catch(x){show(x.message);button.disabled=false;button.textContent="Continue to secure payment"}};
async function verify(){const p=new URLSearchParams(location.search),ref=p.get("reference");if(p.get("topup")!=="callback"||!ref)return;show("Confirming your top-up with the payment provider...","info");try{await api("/api/wallet/topups/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reference:ref})});show("Top-up verified. Your wallet has been credited.","success");history.replaceState({},"","wallet.html")}catch(x){show(x.message)}}
document.getElementById("logout").onclick=()=>{localStorage.removeItem("wayneToken");localStorage.removeItem("wayneUser");location.href="login.html"};(async()=>{try{await verify();await load()}catch(x){show(x.message)}})();
</script></body></html>
